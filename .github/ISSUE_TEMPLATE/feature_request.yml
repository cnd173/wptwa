name: Feature request
description: Suggest an in-scope improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Requests for betting automation, seat scripting, screen scraping, HUDs, or strategy assistance are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What window-management problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Permissions and safety impact
      description: Explain whether this changes target matching, permissions, data access, storage, or network behavior.
    validations:
      required: true
